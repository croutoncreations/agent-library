# LOCAL ONLY: `wrangler dev` and the test suite (npm test). Placeholder IDs; never deploy this file.
# Your own installation's config is wrangler.toml (gitignored), created from wrangler.example.toml
# or generated by `npm run setup:self-host` (docs/self-hosting.md).
name = "agent-library"
main = "src/index.js"
compatibility_date = "2025-09-01"
# Required by workers-oauth-provider for Client ID Metadata Document fetches (SSRF protection).
compatibility_flags = ["global_fetch_strictly_public"]

# Local OAuth KV (placeholder id, no remote namespace referenced).
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "00000000000000000000000000000000"

[[rules]]
type = "Text"
globs = ["**/*.txt"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "agent-library-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "agent-library-blobs"
